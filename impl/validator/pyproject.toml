[project]
name = "agenttrust-validator"
version = "0.1.0"
description = "AgentTrust validator: independent re-derivation, attestation and immediate release (VAL-001..004)."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "web3==8.0.0",
    "eth-account==0.14.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenttrust_validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
